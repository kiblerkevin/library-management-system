apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  namespace: library-system
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  hostPath:
    path: /data/postgres
    type: DirectoryOrCreate
