apiVersion: v1
kind: Service
metadata:
  name: library-metrics
  namespace: library-system
  labels:
    app: library-app
spec:
  selector:
    app: library-app
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: library-app-metrics
  namespace: library-system
spec:
  selector:
    matchLabels:
      app: library-app
  endpoints:
  - port: metrics
    path: /actuator/prometheus
    interval: 30s
